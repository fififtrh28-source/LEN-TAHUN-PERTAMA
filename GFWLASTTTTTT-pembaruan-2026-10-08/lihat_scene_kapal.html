<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lihat Scene Kapal</title>
  <style>
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 16px;
      background: #111827;
      border-bottom: 1px solid #334155;
    }
    h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
    }
    nav {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    a {
      color: #e5e7eb;
      text-decoration: none;
      border: 1px solid #475569;
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 13px;
      background: #1f2937;
    }
    a.primary {
      background: #dc2626;
      border-color: #ef4444;
      font-weight: 700;
    }
    iframe {
      display: block;
      flex: 1 1 auto;
      width: 100%;
      min-height: 0;
      border: 0;
      background: #000;
    }    
        .scene-error {
      margin: 12px 16px;
      padding: 10px 12px;
      border: 1px solid #ef4444;
      border-radius: 6px;
      background: #3f1d1d;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Scene Kapal Sentinel-1 - titik kapal aktif</h1>
    <nav>
      <a class="primary" data-scene-file="SENTINEL1_SCENE_MAPS/{scene}_interactive.html" target="scene">Interactive + titik</a>
      <a data-scene-file="HASIL_TRAJECTORY_AIS_KALMAN_SIMPLE/{scene}_ais_kalman_simple.png" target="scene">AIS/Kalman simple</a>
      <a data-scene-file="HASIL_SCENE_KAPAL_TANPA_KETERANGAN/{scene}_ships_only_no_text.png" target="scene">Kapal tanpa tulisan</a>
      <a data-scene-file="HASIL_SCENE_KAPAL_TANPA_KETERANGAN/{scene}_sar_clean_no_annotation.png" target="scene">SAR polos</a>
    </nav>
  </header>
  <p id="scene-error" class="scene-error" role="alert" hidden></p>
  <iframe name="scene" title="Scene Sentinel-1"></iframe>
  <script>
    // R-042: untuk ganti scene, cukup ubah SCENE di bawah ini.
    const SCENE = "S1A_IW_GRDH_1SDV_20260215T104128_20260215T104157_063228_07F03A_350C_vv";
    const BASE = "KAPAL%20YG%20TERDETEKSI/";
    const sceneUrl = (pattern) => BASE + pattern.replace("{scene}", SCENE);
    const frame = document.querySelector("iframe[name='scene']");
    const errorBox = document.getElementById("scene-error");

    // R-043: cek dulu file-nya ada; kalau tidak, tampilkan pesan, bukan iframe hitam kosong.
    async function openScene(url) {
      errorBox.hidden = true;
      if (location.protocol !== "file:") {
        try {
          const response = await fetch(url, { method: "HEAD" });
          if (!response.ok) throw new Error("HTTP " + response.status);
        } catch (error) {
          errorBox.textContent = "File scene tidak ditemukan: " + decodeURIComponent(url) + " (" + error.message + ")";
          errorBox.hidden = false;
          frame.removeAttribute("src");
          return;
        }
      }
      frame.src = url;
    }

    document.querySelectorAll("a[data-scene-file]").forEach((link) => {
      link.href = sceneUrl(link.dataset.sceneFile);
      link.addEventListener("click", (event) => {
        event.preventDefault();
        openScene(link.href);
      });
    });
    openScene(sceneUrl("SENTINEL1_SCENE_MAPS/{scene}_interactive.html"));
  </script>
</body>
</html>
